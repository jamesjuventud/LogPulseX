# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

  android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Android NDK
      uses: android-actions/setup-android@v3

    - name: Install Android NDK
      shell: bash
      run: |
        sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator" "platform-tools" "ndk;27.2.12479018" "system-images;android-34;google_apis;x86_64"
        echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" >> "$GITHUB_ENV"

    - name: Set up Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.9

    - name: Create CI signing key
      shell: bash
      run: |
        keytool -genkeypair -v \
          -keystore "$RUNNER_TEMP/logpulsex-ci.jks" \
          -storepass logpulsex-ci \
          -alias logpulsex-ci \
          -keypass logpulsex-ci \
          -keyalg RSA -keysize 2048 -validity 1 \
          -dname "CN=LogPulseX CI, O=LogPulseX, C=US"

    - name: Build and test Android app
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_2
        force-avd-creation: true
        emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
        disable-animations: true
        script: gradle -p mobile/android -PtestBuildType=${{ matrix.build_type }} -PciKeystore="$RUNNER_TEMP/logpulsex-ci.jks" -PciKeystorePassword=logpulsex-ci -PciKeyAlias=logpulsex-ci -PciKeyPassword=logpulsex-ci :app:assemble${{ matrix.build_type }} :app:connected${{ matrix.build_type }}AndroidTest --stacktrace

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ matrix.build_type }}-apk
        path: mobile/android/app/build/outputs/apk/**/*.apk

  ios:
    runs-on: macos-latest

    strategy:
      matrix:
        build_type: [Debug, Release]

    steps:
    - uses: actions/checkout@v4

    - name: Configure iOS CMake
      run: >
        cmake -B build-ios-${{ matrix.build_type }}
        -G Xcode
        -DCMAKE_SYSTEM_NAME=iOS
        -DCMAKE_OSX_SYSROOT=iphonesimulator
        -DCMAKE_OSX_ARCHITECTURES=arm64
        -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
        -DLOGPULSEX_BUILD_IOS_APP=ON
        -DLOGPULSEX_BUILD_EXAMPLES=OFF
        -DLOGPULSEX_BUILD_TESTS=OFF
        -DLOGPULSEX_BUILD_BENCHMARKS=OFF
        -S .

    - name: Build iOS
      run: cmake --build build-ios-${{ matrix.build_type }} --config ${{ matrix.build_type }}

    - name: Install and test iOS app
      shell: bash
      run: |
        DEVICE_ID=$(xcrun simctl list devices available | grep -m 1 -E 'iPhone.*\(Shutdown\)' | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
        test -n "$DEVICE_ID"
        xcrun simctl boot "$DEVICE_ID" || true
        xcrun simctl bootstatus "$DEVICE_ID" -b
        APP_PATH=$(find "build-ios-${{ matrix.build_type }}" -name 'LogPulseXExample.app' -type d -print -quit)
        test -n "$APP_PATH"
        xcrun simctl install "$DEVICE_ID" "$APP_PATH"
        xcrun simctl launch "$DEVICE_ID" com.logpulsex.example

    - name: Upload iOS app
      uses: actions/upload-artifact@v4
      with:
        name: ios-${{ matrix.build_type }}-app
        path: build-ios-${{ matrix.build_type }}/**/LogPulseXExample.app
